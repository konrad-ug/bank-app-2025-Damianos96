name: Unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest coverage
          pip install -r requirements.txt

      - name: Start Flask Server in Background
        run: |
          nohup python -m flask --app app/api.py run --host=0.0.0.0 --port=5000 > server.log 2>&1 &

          echo "Waiting for server to start..."
          sleep 5

      - name: Check if server is running (Debug)
        run: |
          curl -v http://127.0.0.1:5000/api/accounts/count || echo "Server is NOT responding"

      - name: Test with pytest
        run: |
          python3 -m coverage run --source=src -m pytest

      - name: Show server logs if failed
        if: always()
        run: |
          echo "=== FLASK SERVER LOGS ==="
          cat server.log
