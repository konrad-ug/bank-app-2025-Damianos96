name: API Functional Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask Server
        run: |
          nohup python -m flask --app app/api.py run --port=5000 > server.log 2>&1 &
          echo "Waiting for server to launch..."
          sleep 5

      - name: Check if server is running
        run: |
          curl http://127.0.0.1:5000/api/accounts/count || (echo "Server start failed! Logs:" && cat server.log && exit 1)

      - name: Execute API tests
        run: |
          python3 -m pytest tests/api

      - name: Print Server Logs on Failure
        if: failure()
        run: |
          echo "=== SERVER LOGS ==="
          cat server.log
