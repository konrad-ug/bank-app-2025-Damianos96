name: API Tests with Mongo

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask Server
        env:
          DB_HOST: localhost
          DB_PORT: 27017
        run: |
          nohup python -m flask --app app/api.py run --port=5000 > server.log 2>&1 &

          echo "Waiting for server to launch..."
          sleep 5

      - name: Check if server is running
        run: |
          curl http://127.0.0.1:5000/api/accounts/count || (echo "Server start failed! Logs:" && cat server.log && exit 1)

      - name: Execute API tests
        run: |
          python3 -m pytest tests/api

      - name: Execute Unit tests
        run: |
          python3 -m pytest tests/unit

      - name: Print Server Logs on Failure
        if: failure()
        run: |
          echo "=== SERVER LOGS ==="
          cat server.log
